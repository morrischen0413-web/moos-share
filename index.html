  <base target="_top">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f3ee;
      color: #153f32;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 16px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    .card img {
      width: 100%;
      display: block;
      border-radius: 18px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      object-position: top;
    }
    h1 {
      margin: 22px 0 10px;
      font-size: 30px;
      line-height: 1.25;
    }
    p {
      margin: 0;
      font-size: 18px;
      line-height: 1.7;
      color: #5f665f;
    }
    button {
      width: 100%;
      margin-top: 26px;
      padding: 17px 20px;
      border: 0;
      border-radius: 12px;
      background: #1f664f;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      min-height: 24px;
      font-size: 15px;
      color: #456458;
    }

  <main class="card">
    <img src="https://i.ibb.co/7xFqDT56/about-Moos.png" alt="沐思花藝設計">

    <p>美學 × 創意 × 花藝設計<br>為品牌與空間創造獨特價值</p>
    <button id="shareButton" onclick="shareFlex()" disabled>分享給 LINE 好友</button>
    <div id="status">LINE 連線中…</div>

    const LIFF_ID = "2010673862-CeTg8hAZ";

    async function initializeLiff() {
      const status = document.getElementById("status");
      const button = document.getElementById("shareButton");

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        button.disabled = false;
        status.textContent = "可以分享給 LINE 好友";
      } catch (error) {
        console.error(error);
        status.textContent = "LINE 連線失敗：" + error.message;
      }
    }

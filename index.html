<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOOS Floral Design</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #edf4ff;
      color: #173d32;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #edf4ff;
      padding: 18px 0 24px;
    }

    .slider-wrap {
      width: 100%;
    }

    .slider {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 10px 24px 22px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    .card {
      position: relative;
      flex: 0 0 86vw;
      max-width: 460px;
      height: min(760px, 82vh);
      min-height: 620px;
      overflow: hidden;
      border-radius: 28px;
      background: #d9ded9;
      scroll-snap-align: center;
      box-shadow: 0 12px 34px rgba(21, 63, 50, 0.18);
    }

    .card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
    }

    .overlay {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      min-height: 43%;
      padding: 76px 22px 22px;
      color: #ffffff;
      background: linear-gradient(
        to top,
        rgba(3, 48, 58, 0.99) 0%,
        rgba(3, 48, 58, 0.95) 72%,
        rgba(3, 48, 58, 0) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .overlay h2 {
      margin: 0;
      font-size: 31px;
      line-height: 1.2;
    }

    .overlay p {
      margin: 12px 0 18px;
      color: #eef4f1;
      font-size: 17px;
      line-height: 1.58;
    }

    .card-button {
      display: block;
      width: 100%;
      padding: 15px 14px;
      border: 1px solid rgba(255,255,255,0.34);
      border-radius: 9px;
      background: #082e31;
      color: #ffffff;
      text-align: center;
      font-size: 18px;
    }

    .button-stack {
      display: grid;
      gap: 10px;
    }

    .share-area {
      padding: 0 24px;
    }

    #shareButton {
      width: 100%;
      max-width: 460px;
      display: block;
      margin: 0 auto;
      padding: 17px 20px;
      border: 0;
      border-radius: 13px;
      background: #1f664f;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(31, 102, 79, 0.24);
    }

    #shareButton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    #status {
      min-height: 22px;
      margin-top: 10px;
      text-align: center;
      color: #51665e;
      font-size: 14px;
    }

    @media (min-width: 600px) {
      .slider {
        padding-left: calc((100vw - 460px) / 2);
        padding-right: calc((100vw - 460px) / 2);
      }

      .card {
        flex-basis: 460px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="slider-wrap">
      <div class="slider" aria-label="沐思六張介紹卡片">

        <article class="card">
          <img src="images/hero1.jpg" alt="關於沐思">
          <div class="overlay">
            <h2>關於沐思</h2>
            <p>為品牌與空間創造獨特價值<br>空間布置｜裝置藝術｜花藝教學</p>
            <a class="card-button" href="https://www.moos.com.tw/AboutMoos" onclick="return openExternal(event, this.href)">認識沐思</a>
          </div>
        </article>

        <article class="card">
          <img src="images/project.jpg" alt="花藝場佈">
          <div class="overlay">
            <h2>花藝場佈</h2>
            <p>創意花藝 × 巨型裝置<br>打造吸睛、有話題的品牌空間</p>
            <a class="card-button" href="https://www.moos.com.tw/Project" onclick="return openExternal(event, this.href)">更多資訊</a>
          </div>
        </article>

        <article class="card">
          <img src="images/course.jpg" alt="德式花藝課程">
          <div class="overlay">
            <h2>德式花藝課程</h2>
            <p>從設計邏輯到結構訓練<br>建立獨立花藝創作能力</p>
            <a class="card-button" href="https://www.moos.com.tw/BasicCourse" onclick="return openExternal(event, this.href)">了解課程</a>
          </div>
        </article>

        <article class="card">
          <img src="images/giant.jpg" alt="巨型花藝術課程">
          <div class="overlay">
            <h2>巨型花藝術課程</h2>
            <p>從花型設計到結構製作<br>打造大型花藝裝置創作能力</p>
            <a class="card-button" href="https://www.moos.com.tw/GiantFlowerCourse" onclick="return openExternal(event, this.href)">了解課程</a>
          </div>
        </article>

        <article class="card">
          <img src="images/social.jpg" alt="Social Media">
          <div class="overlay">
            <h2>社群媒體</h2>
            <p>追蹤沐思最新作品<br>空間設計與課程活動</p>
            <div class="button-stack">
              <a class="card-button" href="https://www.facebook.com/profile.php?id=100022162093295" onclick="return openExternal(event, this.href)">Facebook</a>
              <a class="card-button" href="https://www.instagram.com/moosfloraldesign/" onclick="return openExternal(event, this.href)">Instagram</a>
              <a class="card-button" href="https://www.threads.com/@moosfloraldesign" onclick="return openExternal(event, this.href)">Threads</a>
            </div>
          </div>
        </article>

        <article class="card">
          <img src="images/about2.jpg" alt="聯絡沐思">
          <div class="overlay">
            <h2>聯絡沐思</h2>
            <p>場佈設計、品牌活動<br>課程與合作洽詢</p>
            <div class="button-stack">
              <a class="card-button" href="https://line.me/R/ti/p/@604vozcf?oat_content=url&ts=12251800" onclick="return openExternal(event, this.href)">加入官方 LINE</a>
              <a class="card-button" href="https://maps.app.goo.gl/ri2if9PH62GLWELR7?g_st=il" onclick="return openExternal(event, this.href)">Google Maps</a>
              <a class="card-button" href="tel:0926714519" onclick="return openExternal(event, this.href)">撥打電話</a>
            </div>
          </div>
        </article>

      </div>
    </section>

    <section class="share-area">
      <button id="shareButton" onclick="shareFlex()" disabled>
        分享給 LINE 好友
      </button>
      <div id="status">LINE 連線中…</div>
    </section>

  </main>

  <script>
    const LIFF_ID = "2010673862-CeTg8hAZ";
    const IMAGE_BASE = "https://morrischen0413-web.github.io/moos-share/images/";

    const URLS = {
      about: "https://www.moos.com.tw/AboutMoos",
      project: "https://www.moos.com.tw/Project",
      basicCourse: "https://www.moos.com.tw/BasicCourse",
      giantCourse: "https://www.moos.com.tw/GiantFlowerCourse",
      facebook: "https://www.facebook.com/profile.php?id=100022162093295",
      instagram: "https://www.instagram.com/moosfloraldesign/",
      threads: "https://www.threads.com/@moosfloraldesign",
      officialLine: "https://line.me/R/ti/p/@604vozcf?oat_content=url&ts=12251800",
      maps: "https://maps.app.goo.gl/ri2if9PH62GLWELR7?g_st=il",
      phone: "tel:0926714519"
    };

    function openExternal(event, url) {
      if (event) event.preventDefault();

      try {
        if (
          typeof liff !== "undefined" &&
          typeof liff.isInClient === "function" &&
          liff.isInClient()
        ) {
          liff.openWindow({
            url: url,
            external: true
          });
        } else {
          const opened = window.open(url, "_blank", "noopener,noreferrer");
          if (!opened) {
            window.location.href = url;
          }
        }
      } catch (error) {
        console.error("開啟外部連結失敗：", error);
        window.location.href = url;
      }

      return false;
    }

    async function initializeLiff() {
      const status = document.getElementById("status");
      const button = document.getElementById("shareButton");

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        button.disabled = false;
        status.textContent = "可以分享 6 張卡片給 LINE 好友";
      } catch (error) {
        console.error(error);
        status.textContent = "LINE 連線失敗：" + error.message;
      }
    }

    function flexButton(label, uri) {
      return {
        type: "box",
        layout: "vertical",
        height: "46px",
        justifyContent: "center",
        cornerRadius: "6px",
        borderWidth: "1px",
        borderColor: "#FFFFFF33",
        backgroundColor: "#082E31",
        action: {
          type: "uri",
          label: label,
          uri: uri
        },
        contents: [
          {
            type: "text",
            text: label,
            color: "#ffffff",
            align: "center",
            size: "md"
          }
        ]
      };
    }

    function singleButtonBubble(imageName, title, description, buttonLabel, buttonUrl) {
      return {
        type: "bubble",
        size: "giga",
        body: {
          type: "box",
          layout: "vertical",
          paddingAll: "0px",
          contents: [
            {
              type: "image",
              url: IMAGE_BASE + imageName,
              size: "full",
              aspectMode: "cover",
              aspectRatio: "9:16",
              gravity: "top"
            },
            {
              type: "box",
              layout: "vertical",
              position: "absolute",
              offsetBottom: "0px",
              offsetStart: "0px",
              offsetEnd: "0px",
              paddingAll: "22px",
              paddingTop: "78px",
              background: {
                type: "linearGradient",
                angle: "0deg",
                startColor: "#03303AFF",
                endColor: "#03303A00"
              },
              contents: [
                {
                  type: "text",
                  text: title,
                  size: "xxl",
                  color: "#ffffff",
                  weight: "bold",
                  wrap: true
                },
                {
                  type: "text",
                  text: description,
                  color: "#F0F4F3",
                  size: "md",
                  wrap: true,
                  margin: "sm",
                  lineSpacing: "5px"
                },
                {
                  ...flexButton(buttonLabel, buttonUrl),
                  margin: "xl"
                }
              ]
            }
          ]
        }
      };
    }

    function threeButtonBubble(imageName, title, description, buttons) {
      return {
        type: "bubble",
        size: "giga",
        body: {
          type: "box",
          layout: "vertical",
          paddingAll: "0px",
          contents: [
            {
              type: "image",
              url: IMAGE_BASE + imageName,
              size: "full",
              aspectMode: "cover",
              aspectRatio: "9:16",
              gravity: "top"
            },
            {
              type: "box",
              layout: "vertical",
              position: "absolute",
              offsetBottom: "0px",
              offsetStart: "0px",
              offsetEnd: "0px",
              paddingAll: "20px",
              paddingTop: "82px",
              background: {
                type: "linearGradient",
                angle: "0deg",
                startColor: "#03303AFF",
                endColor: "#03303A00"
              },
              contents: [
                {
                  type: "text",
                  text: title,
                  size: "xxl",
                  color: "#ffffff",
                  weight: "bold",
                  wrap: true
                },
                {
                  type: "text",
                  text: description,
                  color: "#F0F4F3",
                  size: "md",
                  wrap: true,
                  margin: "sm",
                  lineSpacing: "5px"
                },
                {
                  type: "box",
                  layout: "vertical",
                  spacing: "sm",
                  margin: "lg",
                  contents: buttons.map(item => flexButton(item.label, item.uri))
                }
              ]
            }
          ]
        }
      };
    }

    function buildCarousel() {
      return {
        type: "carousel",
        contents: [
          singleButtonBubble(
            "hero1.jpg",
            "關於沐思",
            "為品牌與空間創造獨特價值\n空間布置｜裝置藝術｜花藝教學",
            "認識沐思",
            URLS.about
          ),
          singleButtonBubble(
            "project.jpg",
            "花藝場佈",
            "創意花藝 × 巨型裝置\n打造吸睛、有話題的品牌空間",
            "更多資訊",
            URLS.project
          ),
          singleButtonBubble(
            "course.jpg",
            "德式花藝課程",
            "從設計邏輯到結構訓練\n建立獨立花藝創作能力",
            "了解課程",
            URLS.basicCourse
          ),
          singleButtonBubble(
            "giant.jpg",
            "巨型花藝術課程",
            "從花型設計到結構製作\n打造大型花藝裝置創作能力",
            "了解課程",
            URLS.giantCourse
          ),
          threeButtonBubble(
            "social.jpg",
            "社群媒體",
            "追蹤沐思最新作品\n空間設計與課程活動",
            [
              { label: "Facebook", uri: URLS.facebook },
              { label: "Instagram", uri: URLS.instagram },
              { label: "Threads", uri: URLS.threads }
            ]
          ),
          threeButtonBubble(
            "about2.jpg",
            "聯絡沐思",
            "場佈設計、品牌活動\n課程與合作洽詢",
            [
              { label: "加入官方 LINE", uri: URLS.officialLine },
              { label: "Google Maps", uri: URLS.maps },
              { label: "撥打電話", uri: URLS.phone }
            ]
          )
        ]
      };
    }

    async function shareFlex() {
      const status = document.getElementById("status");
      const button = document.getElementById("shareButton");

      button.disabled = true;
      status.textContent = "正在開啟好友名單…";

      try {
        if (!liff.isApiAvailable("shareTargetPicker")) {
          status.textContent = "目前環境不支援好友分享，請使用最新版 LINE 開啟。";
          return;
        }

        const result = await liff.shareTargetPicker(
          [
            {
              type: "flex",
              altText: "沐思植物美學室｜6 張品牌、場佈、課程與聯絡卡片",
              contents: buildCarousel()
            }
          ],
          {
            isMultiple: true
          }
        );

        status.textContent = result ? "分享完成" : "已取消分享";
      } catch (error) {
        console.error(error);
        status.textContent = "分享失敗：" + error.message;
      } finally {
        button.disabled = false;
      }
    }

    initializeLiff();
  </script>
</body>
</html>
